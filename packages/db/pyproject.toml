[project]
name = "kalchas-db"
version = "3.0.0"
description = "Postgres access: asyncpg pool and Alembic migrations."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
kalchas-migrate = "kalchas_db.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalchas_db"]
