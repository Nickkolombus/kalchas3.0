[project]
name = "kalchas-core"
version = "3.0.0"
description = "Pure domain core: strategy formulas, outcome engine, K-Score, NPEI. No IO."
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
# scikit-learn is imported lazily inside kscore_backtest metric helpers only.
# Kept optional so the scanner and API images stay slim.
metrics = ["scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalchas_core"]
