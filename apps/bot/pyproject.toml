[project]
name = "kalchas-bot"
version = "3.0.0"
description = "Telegram delivery worker (single replica)."
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "kalchas-core",
    "kalchas-db",
]


[project.scripts]
kalchas-bot = "kalchas_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalchas_bot"]
