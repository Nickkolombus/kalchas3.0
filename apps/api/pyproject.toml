[project]
name = "kalchas-api"
version = "3.0.0"
description = "FastAPI service for dashboard and admin."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "kalchas-core",
]

[project.scripts]
kalchas-api = "kalchas_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalchas_api"]
